name: Quality
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bmarket?schema=public
      JWT_SECRET: ci_only_secret_0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm test
      - run: npm run build
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
